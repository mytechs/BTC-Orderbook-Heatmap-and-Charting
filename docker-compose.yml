services:
  orderbook-heatmap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btc-orderbook-heatmap-and-charting
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - heatmap_data:/app/server/data

volumes:
  heatmap_data:
